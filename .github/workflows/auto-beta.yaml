name: Auto Beta Release

# Merging a PR labelled release:patch|minor|major publishes a beta: this tags
# the merge commit and dispatches release.yaml, which gates, publishes to
# PyPI and creates the GitHub pre-release that HACS beta users get.
#
# One beta train: the next version is the latest stable bumped by the
# largest release label among all PRs merged since that stable, and never
# lower than a beta already in flight. A patch merged while v1.13.0-beta.2
# exists becomes v1.13.0-beta.3, not v1.12.3-beta.1.
#
# Taking the bump from every PR since the stable (not just this one) means a
# run cancelled by a burst of merges loses nothing: the next run publishes
# a beta that contains the cancelled PR and honours its label.

# Runs on the push to main that a merge makes, not on the PR event: a PR from a
# fork gets a read-only token under pull_request, so tagging failed with a 403.
# A push always has the write token. The merged PR is found from the "(#N)" in
# the squash commit subject, the same way earlier PRs in the train are.
on:
  push:
    branches: [main]

concurrency:
  group: auto-beta
  cancel-in-progress: false

permissions: {}

jobs:
  beta-release:
    name: Create Beta Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag
      actions: write # dispatch release.yaml
      pull-requests: read # labels of earlier PRs in the train
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the merged PR for a release label
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          release=false
          n=$(git log -1 --format=%s "${SHA}" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p')
          if [ -n "${n}" ]; then
            labels=$(gh pr view "${n}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name]')
            if grep -qE '"release:(patch|minor|major)"' <<< "${labels}"; then
              release=true
            fi
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "Merged PR: ${n:-none}, release label: ${release}"

      - name: Determine bump from every labelled PR since the last stable
        id: bump
        if: steps.pr.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          latest_stable=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | { grep -v '-' || true; } \
            | sort -V \
            | tail -1)
          range="${latest_stable:+${latest_stable}..}${SHA}"

          labels=""
          for n in $(git log --format=%s "${range}" | sed -nE 's/.*\(#([0-9]+)\)$/\1/p'); do
            labels+=$(gh pr view "${n}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '[.labels[].name]')
          done

          if grep -q '"release:major"' <<< "${labels}"; then
            type="major"
          elif grep -q '"release:minor"' <<< "${labels}"; then
            type="minor"
          else
            type="patch"
          fi
          echo "type=${type}" >> "$GITHUB_OUTPUT"
          echo "Bump since ${latest_stable:-the beginning}: ${type}"

      - name: Compute next beta version
        id: version
        if: steps.pr.outputs.release == 'true'
        env:
          BUMP: ${{ steps.bump.outputs.type }}
        run: |
          latest_stable=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' \
            | { grep -v '-' || true; } \
            | sort -V \
            | tail -1)
          latest_stable="${latest_stable:-v0.0.0}"
          latest_stable="${latest_stable#v}"
          IFS='.' read -r major minor patch <<< "${latest_stable}"

          case "${BUMP}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
          esac
          new="${major}.${minor}.${patch}"

          # Join the beta train already in flight for a higher version
          # (betas of versions that already went stable don't count).
          for t in $(git tag -l 'v*-beta.*'); do
            base="${t#v}"
            base="${base%-beta.*}"
            if [ "$(printf '%s\n%s\n' "$base" "$latest_stable" | sort -V | tail -1)" != "$latest_stable" ]; then
              new=$(printf '%s\n%s\n' "$new" "$base" | sort -V | tail -1)
            fi
          done

          beta_num=1
          for t in $(git tag -l "v${new}-beta.*"); do
            n="${t##*-beta.}"
            if [ "$n" -ge "$beta_num" ]; then
              beta_num=$((n + 1))
            fi
          done

          tag="v${new}-beta.${beta_num}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Computed: ${tag}"

      - name: Tag merge commit
        if: steps.pr.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          SHA: ${{ github.sha }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f "ref=refs/tags/${TAG}" -f "sha=${SHA}"

      - name: Publish beta
        if: steps.pr.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run release.yaml --repo "${GITHUB_REPOSITORY}" --ref main -f "tag_name=${TAG}"
          echo "Tagged ${TAG} and dispatched release.yaml."
