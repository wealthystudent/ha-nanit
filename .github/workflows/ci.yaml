name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: stacked PRs (base = another PR's branch) must
  # run CI too, or they merge into their base unvalidated.
  pull_request:
  # The release workflow reuses this as its gate, so a release runs exactly
  # the checks a PR does.
  workflow_call:
    inputs:
      ref:
        description: Git ref to check out (the release workflow passes its tag)
        type: string
        default: ""

# PR pushes share a group per PR, so a newer push cancels the older run.
# Main pushes and release gates get a group of their own (commit or tag), so
# a burst of merges never cancels a queued run on main.
concurrency:
  group: ci-${{ inputs.ref || (github.event_name == 'pull_request' && github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"

      - name: Install ruff
        # Same pinned range devs use, so a new ruff minor can't redden CI
        # without a repo change.
        run: pip install "$(grep -m1 -E '^ruff[<>=~]' dev/requirements.txt)"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: dev/requirements.txt

      - name: Install dependencies
        run: pip install -r dev/requirements.txt

      - name: Run mypy
        # Targets and strictness live in pyproject.toml, shared with `just check`.
        run: mypy

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: dev/requirements.txt

      - name: Install dependencies
        run: pip install -r dev/requirements.txt

      - name: Run integration tests with coverage
        run: python -m pytest tests/unit/ --tb=short --cov=custom_components/nanit --cov-fail-under=80

  test-aionanit:
    name: aionanit Library Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: packages/aionanit/pyproject.toml

      - name: Install dependencies
        # The library alone, without Home Assistant, as PyPI users get it.
        run: pip install -e "packages/aionanit[dev]"

      - name: Run aionanit tests
        run: python -m pytest packages/aionanit/tests/ --tb=short

  protobuf-drift:
    name: Protobuf Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Install protoc
        run: |
          # Pinned protoc: regenerating with a different version produces
          # spurious diffs, so bump this deliberately alongside the
          # committed *_pb2.py.
          PROTOC_VERSION="29.5"
          PROTOC_SHA256="a3f094363cd205c6f7af0d1b9305cb4c8517043f265cdb188f098cae93e8b217"
          curl -fsSLO "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          echo "${PROTOC_SHA256}  protoc-${PROTOC_VERSION}-linux-x86_64.zip" | sha256sum -c -
          unzip -q "protoc-${PROTOC_VERSION}-linux-x86_64.zip" -d "$HOME/.local"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm "protoc-${PROTOC_VERSION}-linux-x86_64.zip"

      - name: Check S&L protobuf is in sync with its .proto
        run: |
          protoc --python_out=custom_components/nanit/aionanit_sl \
            --pyi_out=custom_components/nanit/aionanit_sl \
            --proto_path=custom_components/nanit/aionanit_sl \
            custom_components/nanit/aionanit_sl/sound_light.proto
          if ! git diff --quiet custom_components/nanit/aionanit_sl/; then
            echo "sound_light_pb2.py/.pyi is out of date with sound_light.proto."
            echo "Regenerate with protoc 29.5 (--python_out --pyi_out) and commit."
            git diff custom_components/nanit/aionanit_sl/
            exit 1
          fi
          echo "sound_light_pb2.py and .pyi are up to date"

  frontend-drift:
    name: Card Bundle Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build card
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Check committed bundle matches source
        run: |
          if ! git diff --quiet custom_components/nanit/frontend/nanit-card.js; then
            echo "nanit-card.js is out of date with frontend/src."
            echo "Run 'just card' and commit the rebuilt bundle."
            exit 1
          fi
          echo "nanit-card.js is up to date"

  workflow-lint:
    name: Workflow Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: actionlint
        run: |
          ACTIONLINT_VERSION="1.7.12"
          ACTIONLINT_SHA256="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" actionlint
          ./actionlint -color

      - name: zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install "zizmor==1.30.1"
          zizmor --format=github .github/workflows

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Deliberately unpinned: hassfest validates against current Home
      # Assistant rules, and freezing it would freeze the rule set.
      - uses: home-assistant/actions/hassfest@master

  hacs-validation:
    # Informational, not part of CI OK: it validates repository metadata
    # (topics, releases) that PRs rarely touch and fails on GitHub API
    # hiccups that no code change can fix. continue-on-error keeps a failure
    # here from failing the whole run, which is what the release gate checks.
    name: HACS Validation
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Deliberately unpinned, same reasoning as hassfest.
      - uses: hacs/action@main
        with:
          category: integration
          # topics: repository topics are a GitHub setting (maintainer).
          # brands passes: the committed brand/ assets satisfy it.
          ignore: topics

  ci-ok:
    # The single required status check. Adding or renaming a job above only
    # means listing it here, not editing the branch ruleset.
    name: CI OK
    if: always()
    needs:
      - lint
      - typecheck
      - test-integration
      - test-aionanit
      - protobuf-drift
      - frontend-drift
      - workflow-lint
      - hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check all required jobs passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "Job results: ${RESULTS}"
          jq -e 'all(. == "success")' <<< "${RESULTS}" > /dev/null
