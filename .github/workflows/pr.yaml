name: PR

# Checks PR metadata that CI can't see in the code: the title (it becomes
# the squash commit on main) and the Changelog section (it becomes the
# release notes). Re-runs when the description or labels change.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/release_notes.py
          sparse-checkout-cone-mode: false

      - name: Check title and changelog
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 tools/release_notes.py --check
