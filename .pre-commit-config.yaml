# Hooks run the project's own locked tools through uv, so the versions always
# match `just check` and CI. Type checking stays in `just check`: it needs the
# full Home Assistant environment and is too slow for every commit.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
