services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: ha-nanit-dev
    restart: unless-stopped
    network_mode: host
    volumes:
      - ha-config:/config
      # NANIT_TREE (set by `just dev <branch>`) serves the checkout that has that branch.
      - ${NANIT_TREE:-..}/custom_components:/config/custom_components:ro
      - ${NANIT_TREE:-..}/packages/aionanit:/opt/aionanit
    environment:
      - TZ=Europe/Oslo
    command: >
      bash -c "pip install --no-deps -e /opt/aionanit && exec python -m homeassistant -c /config"

volumes:
  ha-config:
