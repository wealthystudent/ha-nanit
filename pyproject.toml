# Root pyproject.toml: the uv workspace and shared tooling config for the
# ha-nanit monorepo. The root is not a package (the integration ships as a
# zip); the aionanit library is a workspace member with its own pyproject.toml.
#
# `uv sync` installs everything below into .venv from uv.lock.

[project]
name = "ha-nanit"
version = "0.0.0"
requires-python = ">=3.14.2"  # Home Assistant's floor

[dependency-groups]
# Just ruff: the pre-commit hooks and the Claude Code format hook run with
# `--only-group lint`, so they never pull in Home Assistant on a fresh clone.
lint = ["ruff>=0.16,<0.17"]
dev = [
    { include-group = "lint" },
    "aionanit",
    "aiohttp>=3.13,<3.14",  # aioresponses 0.7.x is incompatible with aiohttp 3.14+
    "aioresponses>=0.7,<0.8",
    # PyAV backs the stream integration, which nanit depends on; without it
    # HA cannot set up `stream` and every entry-setup test fails.
    "av>=16.0,<16.1",
    "homeassistant>=2026.5,<2026.7",
    "mypy>=2.1,<3",
    "pre-commit>=4,<5",
    "pytest-cov>=7,<8",
    "pytest-homeassistant-custom-component>=0.13.333,<0.14",
    "rich>=15,<16",
    "syrupy>=5,<6",
    "websockets>=13.0,<16",
]

[tool.uv]
package = false
# Everyone runs the same uv-managed interpreter. It also stops uv from picking
# up a system 3.14.0/3.14.1, which is below requires-python and would fail the
# sync instead of downloading a newer 3.14.
python-preference = "only-managed"
# Floor for contributors; CI pins the exact version in setup-uv.
required-version = ">=0.12.14"

[tool.uv.workspace]
members = ["packages/aionanit"]

[tool.uv.sources]
aionanit = { workspace = true }

[tool.ruff]
target-version = "py313"
line-length = 100
# Generated protobuf modules are protoc output; keep them byte-identical to
# the generator (the drift check in CI diffs against a fresh protoc run).
extend-exclude = ["**/*_pb2.py", "**/*_pb2.pyi", "*.md"]

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "C4",     # flake8-comprehensions
    "D",      # pydocstyle
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "ICN",    # flake8-import-conventions
    "N",      # pep8-naming
    "PGH",    # pygrep-hooks
    "PIE",    # flake8-pie
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "T20",    # flake8-print
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line before class docstring (conflicts with D211)
    "D213",   # Multi-line summary second line (conflicts with D212)
    "E501",   # Line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "T20", "E402", "SIM117"]
"tools/**" = ["D", "T20", "SIM117"]
"**/proto/*_pb2.py" = ["ALL"]
"**/proto/*_pb2.pyi" = ["ALL"]
"**/*_pb2.py" = ["ALL"]
"packages/aionanit/**" = ["D", "N818", "BLE001", "SIM105", "SIM117", "E402", "RUF059", "C408"]
"custom_components/nanit/config_flow.py" = ["BLE001"]
"custom_components/nanit/hub.py" = ["BLE001"]
"custom_components/nanit/aionanit_sl/**" = ["BLE001", "D", "SIM105"]
"tests/unit/test_sl_*" = ["BLE001", "SIM105"]

[tool.ruff.lint.isort]
known-first-party = ["aionanit", "custom_components.nanit"]

[tool.mypy]
python_version = "3.14"
files = ["custom_components/nanit", "packages/aionanit/aionanit"]
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aionanit.proto", "aionanit.proto.*"]
ignore_errors = true

# Same for the S&L generated module: its .pyi provides the names, but the
# google.protobuf base types resolve as Any under strict mode.
[[tool.mypy.overrides]]
module = "nanit.aionanit_sl.sound_light_pb2"
ignore_errors = true

[[tool.mypy.overrides]]
module = "aionanit.camera"
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
# Integration tests. The aionanit suite uses packages/aionanit/pyproject.toml.
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests/unit"]

[tool.pyright]
# Editor language servers (basedpyright, pyright, Pylance). mypy is the type
# checking authority in CI; this only points editors at the uv environment.
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.coverage.run]
omit = ["custom_components/nanit/aionanit_sl/*"]
